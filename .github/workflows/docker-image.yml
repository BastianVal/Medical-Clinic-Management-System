name: CI/CD Pipeline for Spring Boot App

on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # JOB 1: COMPILACIÓN Y PRUEBAS CON MAVEN
  # ==========================================
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run tests
      run: mvn -B test --file pom.xml

    - name: Build with Maven
      run: mvn -B package --file pom.xml -DskipTests

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: spring-boot-app
        path: target/*.jar

  # ==========================================
  # JOB 2: CONSTRUCCIÓN Y SUBIDA DE IMAGEN DOCKER
  # ==========================================
  build-and-push-docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: spring-boot-app
        path: target/

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/appointments:latest
          ${{ secrets.DOCKER_USERNAME }}/appointments:${{ github.sha }}

  # ==========================================
  # JOB 3: DESPLIEGUE EN SERVIDOR AWS EC2
  # ==========================================
  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push-docker-image
    steps:
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        script: |
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/appointments"
          TAG="latest"
          
          # 1. Descargar la imagen más reciente
          docker pull $IMAGE_NAME:$TAG
          
          # 2. Detener y eliminar el contenedor actual si existe
          docker stop appointments-app || true
          docker rm appointments-app || true
          
          # 3. Levantar el nuevo contenedor con puerto y secretos inyectados
          docker run -d \
            --name appointments-app \
            -p 8080:8080 \
            -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            -e DB_URL="${{ secrets.DB_URL }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            -e COORDINATOR_EMAIL="${{ secrets.COORDINATOR_EMAIL }}" \
            -e COORDINATOR_PASSWORD="${{ secrets.COORDINATOR_PASSWORD }}" \
            -e DOCKER_IMAGE="${{ secrets.DOCKER_IMAGE }}" \
            $IMAGE_NAME:$TAG
          
          # 4. Limpieza de imágenes huérfanas en el EC2
          docker image prune -af
